<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>Graceful Society</title>

        <link rel="icon" href="list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" type="text/css" href="css/reset.css" />
        <link rel="stylesheet" type="text/css" href="css/typography.css" />
        <link rel="stylesheet" type="text/css" href="css/main.css" />
        <link rel="stylesheet" type="text/css" href="css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="css/pages/leaderboard.css" />
        <link rel="stylesheet" type="text/css" href="css/pages/home.css" />
        <link rel="stylesheet" type="text/css" href="css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="css/components/btn.css" />
        <link rel="stylesheet" type="text/css" href="css/components/tabs.css" />
        <link rel="stylesheet" type="text/css" href="css/components/topbar.css" />
        <link rel="stylesheet" type="text/css" href="css/pages/submit.css" />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="js/main.js"></script>
    </head>
    <body id="app">
        <header class="topbar" :class="{ dark: store.dark }">
            <div class="topbar__inner">
                <router-link class="topbar__brand" to="/">
                    <img class="topbar__logo" src="list_icon.png" alt="" />
                    <span class="topbar__name">Graceful Society</span>
                    <span class="topbar__badge">v1.0.6</span>
                </router-link>

                <nav class="topbar__nav">
                    <router-link class="topbar__link" to="/">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
                        Home
                    </router-link>
                    <router-link class="topbar__link" to="/list">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
                        List
                    </router-link>
                    <router-link class="topbar__link" to="/leaderboard">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-8M12 20V5M19 20v-12"/></svg>
                        Leaderboard
                    </router-link>
                </nav>

                <div class="topbar__actions">
                    </button>
                    <a class="topbar__icon" href="https://discord.gg/BxWZA2MPBf">
                        <img src="assets/discord.svg" alt="Discord Logo" />
                    </a>
                    <router-link class="topbar__cta" to="/submit">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        Submit Record
                    </router-link>
                </div>
            </div>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
